# Single-instance setup. For multi-instance, duplicate the service block
# and point each to a separate env_file (.env2, .env3) and data volume (./data2, ./data3).
services:
  bot_chatES:
    build: .
    container_name: bot_chatES
    restart: always
    # Remove or replace the network_mode line if you are not using a VPN container.
    # network_mode: container:gluetun
    cpus: "3"
    mem_limit: 4g
    mem_reservation: 1g
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Uncomment below only if using multi-instance shared registry:
      # - ./shared:/app/shared
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
      nproc: 32768
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f main.py || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
